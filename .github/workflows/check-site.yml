name: 都市频道 · 自动回归校验

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "excel-import.js"
      - "shared-sync.js"
      - "api/**"
      - "tests/**"
      - ".github/workflows/check-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test original XLS data and shared API validation
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Validate browser JavaScript syntax
        run: |
          node --check excel-import.js
          node --check shared-sync.js
          node --check api/worker.mjs
          node --check five-minute.js
