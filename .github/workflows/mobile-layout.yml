name: 手机布局回归
on:
  push:
    branches: [main]
    paths: ['index.html', '*.css', '*-sync.js', 'five-minute.js', 'tests/mobile-layout.mjs', '.github/workflows/mobile-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: node tests/mobile-layout.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SCREENSHOT_DIR: mobile-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-screenshots
          path: mobile-screenshots
