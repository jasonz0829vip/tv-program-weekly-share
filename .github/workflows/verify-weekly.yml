name: Verify 都市频道 Excel & Chart Data
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Excel data, financial fields and privacy checks
        run: node --test tests/*.test.cjs tests/*.test.mjs
